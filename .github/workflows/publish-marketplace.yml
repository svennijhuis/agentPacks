name: Publish generated plugin marketplace

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-plugin-marketplace
  cancel-in-progress: false

env:
  MARKETPLACE_BRANCH: marketplace
  SOLUTION: tools/AgentPacks.slnx
  CLI_PROJECT: tools/AgentPacks.Cli

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION" --locked-mode

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-build

      - name: Materialize external URL sources
        run: >
          dotnet run
          --project "$CLI_PROJECT"
          --configuration Release
          --no-build
          -- materialize-external --out "$GITHUB_WORKSPACE"

      - name: Validate completed portable plugin
        run: >
          dotnet run
          --project "$CLI_PROJECT"
          --configuration Release
          --no-build
          -- validate

      - name: Generate Claude compatibility
        run: >
          dotnet run
          --project "$CLI_PROJECT"
          --configuration Release
          --no-build
          -- generate --out "$GITHUB_WORKSPACE"

      - name: Verify generated output
        run: |
          dotnet run \
            --project "$CLI_PROJECT" \
            --configuration Release \
            --no-build \
            -- generate --check
          dotnet run \
            --project "$CLI_PROJECT" \
            --configuration Release \
            --no-build \
            -- materialize-external --check

      - name: Publish marketplace branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          targets=(.claude-plugin/marketplace.json plugins/*/skills)
          # One generated tree per client, plus the manifests that point Claude and Codex at
          # theirs, plus the Windows shims generated beside each authored script pair.
          targets+=(plugins/*/.mcp.json plugins/*/hooks plugins/*/scripts)
          targets+=(plugins/*/.cursor-plugin plugins/*/.codex-plugin plugins/*/com.*)
          # Tracked-but-deleted generated files never match a glob; list them so their removal
          # is staged too.
          while IFS= read -r tracked; do
            targets+=("$tracked")
          done < <(git ls-files 'plugins/*/.mcp.json' 'plugins/*/hooks/*' 'plugins/*/com.*' \
                                'plugins/*/.cursor-plugin/*' 'plugins/*/.codex-plugin/*' \
                                'plugins/*/scripts/*.cmd')

          git add -A -- "${targets[@]}"
          git commit -m "chore: generate plugin marketplace from ${GITHUB_SHA::7}"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$MARKETPLACE_BRANCH" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$MARKETPLACE_BRANCH:$remote_sha" \
              origin "HEAD:$MARKETPLACE_BRANCH"
          else
            git push origin "HEAD:$MARKETPLACE_BRANCH"
          fi
