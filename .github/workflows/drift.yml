name: Detect generated-file drift

on:
  schedule:
    # Monday morning, before the working week starts.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: tools/AgentPacks.slnx
  CLI_PROJECT: tools/AgentPacks.Cli

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Fails when a generated branch's client files no longer match what that commit's portable
      # source produces, which normally means someone edited a generated file by hand. A missing
      # beta branch is skipped until the first publish after this workflow landed.
      - name: Check generated branches
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          for branch in marketplace marketplace-beta; do
            if [[ -z "$(git ls-remote --heads origin "refs/heads/$branch")" ]]; then
              echo "$branch is not on origin yet; skipping"
              continue
            fi

            git fetch origin "$branch"
            git checkout --force --detach "origin/$branch"

            dotnet restore "$SOLUTION" --locked-mode
            dotnet build "$SOLUTION" --configuration Release --no-restore
            dotnet run \
              --project "$CLI_PROJECT" \
              --configuration Release \
              --no-build \
              -- generate --check
            dotnet run \
              --project "$CLI_PROJECT" \
              --configuration Release \
              --no-build \
              -- materialize-external --check

            checked=$((checked + 1))
          done

          if [[ "$checked" -eq 0 ]]; then
            echo "::error::neither generated marketplace branch exists on origin"
            exit 1
          fi
