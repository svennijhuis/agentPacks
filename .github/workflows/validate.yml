name: Validate agentPacks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tools/AgentPacks.slnx --locked-mode

      - name: Build
        run: dotnet build tools/AgentPacks.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tools/AgentPacks.slnx --configuration Release --no-build

      # Generation is written to a temporary directory and validated there. A pull request is not
      # failed for a stale committed catalog: automation owns the generated files, so contributors
      # never need to regenerate or hand-edit them to make CI pass.
      - name: Validate source and prove generation
        run: >
          dotnet run
          --project tools/AgentPacks.Cli
          --configuration Release
          --no-build
          -- validate-all --out "$RUNNER_TEMP/claude-compat"

      - name: Confirm the working tree is unchanged
        run: git diff --exit-code
