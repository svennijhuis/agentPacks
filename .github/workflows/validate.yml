name: Validate agentPacks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SOLUTION: tools/AgentPacks.slnx
  CLI_PROJECT: tools/AgentPacks.Cli

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION" --locked-mode

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-build

      # Generation is written to a temporary directory and validated there. A pull request is not
      # failed for a stale committed catalog: automation owns the generated files, so contributors
      # never need to regenerate or hand-edit them to make CI pass.
      - name: Validate source and prove generation
        run: >
          dotnet run
          --project "$CLI_PROJECT"
          --configuration Release
          --no-build
          -- validate-all --out "$RUNNER_TEMP/claude-compat"

      - name: Confirm the working tree is unchanged
        run: git diff --exit-code
